name: fetch-jobs
on:
  workflow_dispatch:
  schedule:            # UTC. Lagos (UTC+1): 8am, 12pm, 3pm, 6pm, 8pm, 12am
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
    - cron: "0 17 * * *"
    - cron: "0 19 * * *"
    - cron: "0 23 * * *"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch jobs
        run: |
          if [ "$(date -u +%H)" = "07" ] || [ "$(date -u +%H)" = "08" ]; then export DISCOVER=1; fi
          python fetch_jobs.py
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Save results
        run: |
          git config user.name "job-watcher"; git config user.email "bot@users.noreply.github.com"
          git add jobs.json found_boards.json dead_boards.json || true
          git commit -m "update jobs" || exit 0
          git push
