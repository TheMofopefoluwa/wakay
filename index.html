<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job watcher</title>
<style>
:root{--bg:#f7f7f4;--fg:#1c1f23;--mut:#6b7178;--line:#dcdcd6;--acc:#1f5eff;--new:#e8f0ff}
@media(prefers-color-scheme:dark){:root{--bg:#16181b;--fg:#e8e9ea;--mut:#9aa0a6;--line:#2b2f34;--acc:#7da2ff;--new:#1d2740}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 20px}
h1{font-size:1.6rem;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
input{flex:1;min-width:180px}
a.job{display:block;padding:14px 12px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
a.job:hover,a.job:focus-visible{background:var(--new);outline:none}
.t{font-weight:600}.m{color:var(--mut);font-size:.9rem}.n{color:var(--acc);font-weight:600}
</style></head><body><main>
<h1>Job watcher</h1><p class="sub" id="sub">Loading…</p>
<div class="bar"><input id="q" placeholder="Filter by title or company"><select id="s"><option value="">All sources</option><option value="__p">Priority 4 only</option></select></div>
<div id="list"></div></main>
<script>
let D=[],last=localStorage.getItem("seen")||"";
const $=id=>document.getElementById(id);
function ago(t){const h=(Date.now()-new Date(t))/36e5;return h<1?"just now":h<24?Math.floor(h)+"h ago":Math.floor(h/24)+"d ago"}
function render(){
  const q=$("q").value.toLowerCase(),s=$("s").value;
  $("list").innerHTML=D.filter(j=>(!s||(s==="__p"?j.priority:j.source===s))&&(j.title+j.company).toLowerCase().includes(q)).map(j=>
    `<a class="job" href="${j.url}" target="_blank" rel="noopener"><div class="t">${j.title}${j.first_seen>last?' <span class="n">New</span>':''}</div>
    <div class="m">${j.company} · ${j.priority?"★ ":""}${j.source} · ${j.location.trim()||"Location not listed"} · found ${ago(j.first_seen)}</div></a>`).join("")||"<p class='m'>No matching jobs yet.</p>";
}
fetch("jobs.json?"+Date.now()).then(r=>r.json()).then(d=>{
  D=d.jobs.sort((a,b)=>(b.priority-a.priority)||(a.first_seen<b.first_seen?1:-1));[...new Set(D.map(j=>j.source))].forEach(x=>$("s").add(new Option(x,x)));
  $("sub").textContent=`${D.length} jobs. Last checked ${ago(d.updated)}.`+(d.errors.length?` ${d.errors.length} source(s) failed.`:"");
  render();try{localStorage.setItem("seen",d.updated)}catch(e){}
}).catch(()=>$("sub").textContent="jobs.json not found yet. Run the workflow once.");
$("q").oninput=$("s").onchange=render;
</script></body></html>
